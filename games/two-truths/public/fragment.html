<!-- Lobby -->
<div id="lobbyScreen" class="screen">
  <div class="lobby-container">
    <div class="lobby-header">
      <h1 class="logo">Two Truths &amp; a Lie 🤥</h1>
      <p class="subtitle">Spot the lie. Fool the room.</p>
    </div>
    <div class="lobby-form">
      <div class="input-group">
        <label for="playerName">Your Name</label>
        <input type="text" id="playerName" placeholder="Enter your name..." maxlength="20" autocomplete="off">
      </div>
      <div class="lobby-actions">
        <button id="createRoomBtn" class="btn btn-primary"><span class="btn-icon">🎭</span> Create Room</button>
        <div class="divider"><span>OR</span></div>
        <div class="join-row">
          <input type="text" id="roomCodeInput" placeholder="Room Code" maxlength="6" class="room-code-input">
          <button id="joinRoomBtn" class="btn btn-secondary">Join</button>
        </div>
      </div>
    </div>
    <div id="activeRooms" class="active-rooms hidden">
      <h3>🎲 Active Rooms</h3>
      <div id="roomListContainer" class="room-list"></div>
    </div>
  </div>
</div>

<!-- Waiting Room -->
<div id="waitingScreen" class="screen hidden">
  <div class="waiting-container">
    <h2>Room: <span id="roomCodeDisplay" class="room-code"></span></h2>
    <p class="share-text">Share this code — need 3+ players!</p>
    <div id="waitingPlayers" class="player-grid"></div>
    <div class="waiting-actions">
      <button id="startGameBtn" class="btn btn-primary btn-large" disabled>Need 3+ players to start</button>
      <p class="player-count">Players: <span id="playerCount">0</span>/12</p>
    </div>
  </div>
</div>

<!-- Game Screen -->
<div id="gameScreen" class="screen hidden">
  <div class="game-layout">
    <div class="players-panel">
      <div class="phase-info">Scoreboard</div>
      <div id="playerList" class="player-list"></div>
    </div>

    <div class="center-stage">
      <div class="top-bar">
        <div id="phaseLabel" class="phase-label">✍️ Write</div>
        <div id="timerDisplay" class="timer">60</div>
      </div>

      <!-- Submit Phase -->
      <div id="submitPhase">
        <div class="prompt-card">
          <p class="prompt-lead">Write <strong>three</strong> short statements about yourself, then mark the <strong>ONE</strong> that's a lie.</p>
        </div>
        <div class="submit-area">
          <div id="statementRows" class="statement-rows"></div>
          <div class="submit-actions">
            <button id="submitStatementsBtn" class="btn btn-primary btn-large">🤥 Lock In</button>
          </div>
          <p id="submitStatus" class="submit-status"></p>
        </div>
      </div>

      <!-- Guess Phase -->
      <div id="guessPhase" class="hidden">
        <div class="question-card">
          <p class="trio-author"><span id="trioAuthorName" class="author-name"></span>'s three statements</p>
          <p id="guessLead" class="trio-lead">Which one is the LIE? 🤔</p>
        </div>
        <div class="guess-area">
          <div id="guessGrid" class="guess-grid"></div>
          <p id="guessStatus" class="guess-status"></p>
          <p id="guessProgressText" class="progress-indicator"></p>
        </div>
      </div>

      <!-- Reveal Phase -->
      <div id="revealPhase" class="hidden">
        <div class="reveal-card">
          <div id="revealAuthor" class="reveal-author"></div>
          <div id="revealCards" class="reveal-cards"></div>
          <div id="revealStats" class="reveal-stats"></div>
          <div id="revealGuesses" class="reveal-guesses"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Game Over Overlay -->
<div id="gameOverOverlay" class="overlay hidden">
  <div class="game-over-card">
    <h1>🏆 Game Over!</h1>
    <div id="finalScores" class="final-scores"></div>
    <button id="playAgainBtn" class="btn btn-primary btn-large">Play Again</button>
  </div>
</div>
